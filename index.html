<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kathakala Photobooth - Multi Frame & Filters</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Kathakala</h1>
    <p>Virtual Photobooth — Scan, Snap & Download</p>
  </header>

  <div id="selection-screen">
    <div class="section-title">Pilih Desain Frame:</div>
    
    <div class="frame-grid">
      <div class="frame-card selected" onclick="selectFrame('boarding_pass', this)">
        <img src="assets/frames/boarding_pass.png" alt="Boarding Pass">
        <span>Boarding Pass</span>
      </div>

      <div class="frame-card" onclick="selectFrame('movie_ticket', this)">
        <img src="assets/frames/movie_ticket.png" alt="Movie Ticket">
        <span>Movie Ticket</span>
      </div>

      <div class="frame-card" onclick="selectFrame('kathakala_mart', this)">
        <img src="assets/frames/kathakala_mart.png" alt="Kathakala Mart">
        <span>Kathakala Mart</span>
      </div>

      <div class="frame-card" onclick="selectFrame('y2k_antidesign', this)">
        <img src="assets/frames/y2k_antidesign.png" alt="Y2K Style">
        <span>Y2K Style</span>
      </div>
    </div>

    <button class="btn-main" style="width: 100%;" onclick="goToBooth()">Lanjut ke Kamera 📸</button>
  </div>

  <div id="booth-screen">
    <div class="booth-container">
      <video id="webcam" class="filter-normal" autoplay playsinline></video>
      <div id="flash" class="flash-overlay"></div>
      
      <div id="timer-overlay" class="timer-overlay">
        <div id="timer-number" class="timer-number">3</div>
        <div id="pose-indicator" class="pose-indicator">Siap-siap Pose 1</div>
      </div>
    </div>

    <div class="filter-selector">
      <button class="filter-btn active" onclick="setFilter('normal', this)">Normal</button>
      <button class="filter-btn" onclick="setFilter('beauty', this)">Beauty Glow</button>
      <button class="filter-btn" onclick="setFilter('radiant', this)">Radiant Pink</button>
      <button class="filter-btn" onclick="setFilter('fuji_astia', this)">Fuji Astia</button>
      <button class="filter-btn" onclick="setFilter('bw', this)">B&W Noir</button>
      <button class="filter-btn" onclick="setFilter('vintage', this)">Vintage</button>
      <button class="filter-btn" onclick="setFilter('bright', this)">Bright</button>
      <button class="filter-btn" onclick="setFilter('y2k', this)">Y2K Vivid</button>
    </div>

    <div class="controls">
      <button class="btn-secondary" style="flex: 0.35;" id="btn-flip" onclick="switchCamera()">🔄 Flip</button>
      <button class="btn-main" id="btn-start" onclick="startMultiPoseSession()">📸 Mulai (3 Pose)</button>
    </div>
    <button class="btn-secondary" style="margin-top: 10px; width: 100%;" onclick="backToSelection()">⬅️ Ganti Frame</button>
  </div>

  <div id="result-screen">
    <img id="photo-result" alt="Hasil Foto">
    <a id="download-link" class="btn-action btn-download" download="kathakala-photobooth.jpg">📥 Simpan Foto</a>
    <button class="btn-retake" onclick="resetPhoto()">🔄 Foto Ulang</button>
    <p id="upload-status"></p>
  </div>

  <canvas id="canvas"></canvas>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
